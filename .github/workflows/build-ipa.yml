name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project MiPiTang.xcodeproj \
            -scheme MiPiTang \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiPiTang.app Payload/
          zip -qry MiPiTang.ipa Payload
          ls -lh MiPiTang.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MiPiTang-ipa
          path: MiPiTang.ipa
