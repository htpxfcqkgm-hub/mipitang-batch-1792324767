<script>
/* ============ 语言系统（全局） ============ */
let LANG = 'zh';

(() => {
'use strict';

try {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 720;
// 高清屏适配：按 dpr 放大像素，避免糊（上限 2 防止低端机掉帧）
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = Math.round(W * DPR);
canvas.height = Math.round(H * DPR);
ctx.scale(DPR, DPR);

function fit() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  if (!w || w <= 0 || isNaN(w)) w = W;
  if (!h || h <= 0 || isNaN(h)) h = H;
  var s = Math.min(w / W, h / H);
  if (s <= 0 || isNaN(s)) s = 1;
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
fit();
window.addEventListener('resize', fit);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand  = (a, b) => a + Math.random() * (b - a);

const IS_TOUCH = (('ontouchstart' in window) ||
                  (navigator.maxTouchPoints > 0) ||
                  (navigator.msMaxTouchPoints > 0));
function isSmallTouchDevice() {
  return IS_TOUCH && Math.min(window.innerWidth, window.innerHeight) < 700;
}
function isLandscape() { return window.innerWidth > window.innerHeight; }
function needRotateHint() { return false; }
let useTouchControls = IS_TOUCH;

const LINE_Y = 510;
const BACK_BTN = { x: 28, y: 50, r: 18 };

const DIFFS = {
  easy: {
    key:'easy', color:'#7ee787',
    nameZh:'简单', nameEn:'Easy',
    tagZh:'爽游', tagEn:'Casual',
    briefZh:'敌人慢 · 充能快 · 血量 6',
    briefEn:'Slow foes · Fast charge · 6 HP',
    hp:6, invuln:80, speedMul:1.00,
    spawnStart:78, spawnMin:26, spawnRamp:0.006,
    cBullet:2.0, cKill:8.0, cFlatten:3.0,
    shootInterval:7, tankHp:8, zigHp:2, winScore:400
  },
  normal: {
    key:'normal', color:'#79c0ff',
    nameZh:'普通', nameEn:'Normal',
    tagZh:'标准', tagEn:'Standard',
    briefZh:'敌人适中 · 充能一般 · 血量 4',
    briefEn:'Balanced foes · Normal charge · 4 HP',
    hp:4, invuln:55, speedMul:1.32,
    spawnStart:64, spawnMin:21, spawnRamp:0.008,
    cBullet:1.3, cKill:5.5, cFlatten:2.0,
    shootInterval:8, tankHp:12, zigHp:2, winScore:700
  },
  hard: {
    key:'hard', color:'#ff6b6b',
    nameZh:'困难', nameEn:'Hard',
    tagZh:'硬核', tagEn:'Hardcore',
    briefZh:'敌人狂暴 · 充能极慢 · 血量 3',
    briefEn:'Frenzied foes · Slow charge · 3 HP',
    hp:3, invuln:24, speedMul:2.05,
    spawnStart:44, spawnMin:11, spawnRamp:0.013,
    cBullet:0.8, cKill:2.5, cFlatten:3.0,
    shootInterval:11, tankHp:15, zigHp:4, winScore:1100
  }
};
let difficulty = 'easy';
let D = DIFFS.easy;

function dName(d){ return L(d.nameZh, d.nameEn); }
function dTag(d){ return L(d.tagZh, d.tagEn); }
function dBrief(d){ return L(d.briefZh, d.briefEn); }

const RULES = [
  { icon: '🎮',
    titleZh:'移动与射击', titleEn:'Move & Shoot',
    linesZh: ['拖动屏幕 / ← → 或 A D','移动下方的大鸡','大鸡会不停自动喷射酱汁','命中敌人即积累酱汁能量'],
    linesEn: ['Drag the screen / ← → or A D','to move the big chicken below','The chicken auto-fires sauce nonstop','Hits on enemies build sauce energy'] },
  { icon: '🍯',
    titleZh:'酱汁能量条', titleEn:'Sauce Meter',
    linesZh: ['底部能量条显示充能进度','命中 +2 ~ +8，击杀更多','满 100 后可以释放大招','【降维打击】清屏并压扁全场'],
    linesEn: ['The bottom bar shows charge progress','+2 to +8 per hit, more per kill','At 100 you can unleash the ultimate','[DIMENSION STRIKE] clears and flattens all'] },
  { icon: '⚠️',
    titleZh:'红色防线', titleEn:'The Red Line',
    linesZh: ['屏幕中部的红色虚线','就是你的生死防线','敌人越过防线会立刻扣血','血量在右上角，归零即失败'],
    linesEn: ['The red dashed line mid-screen','is your life-or-death boundary','Enemies crossing it cost you HP at once','HP is top-right; zero means defeat'] },
  { icon: '👾',
    titleZh:'敌人图鉴', titleEn:'Enemy Codex',
    enemyGuide: true,
    enemies: [
      { type:'grunt', color:'#7ee787',
        nameZh:'绿圆怪', nameEn:'Green Blob',
        descZh:'血薄 · 直冲 · 10 分', descEn:'Thin · Charges straight · 10 pts',
        hpZh:'1 血', hpEn:'1 HP' },
      { type:'zig',   color:'#79c0ff',
        nameZh:'蓝菱怪', nameEn:'Blue Diamond',
        descZh:'蛇形走位 · 速度快 · 15 分', descEn:'Zigzags · Fast · 15 pts',
        hpZh:'2~4 血', hpEn:'2~4 HP' },
      { type:'tank',  color:'#d2a8ff',
        nameZh:'紫盾怪', nameEn:'Purple Tank',
        descZh:'肉盾 · 移动慢 · 30 分', descEn:'Tanky · Slow · 30 pts',
        hpZh:'8~15 血', hpEn:'8~15 HP' }
    ] },
  { icon: '🏆',
    titleZh:'难度与胜利', titleEn:'Difficulty & Victory',
    linesZh: ['简单 400 / 普通 700 / 困难 1100','达到目标分立即通关','困难敌人更快 · 更厚 · 更多','充能变慢，血量仅 3，请谨慎'],
    linesEn: ['Easy 400 / Normal 700 / Hard 1100','Hit the target score to win instantly','Hard: faster, tankier, more enemies','Slower charge, only 3 HP — be careful'] },
  { icon: '📱',
    titleZh:'设备与返回', titleEn:'Device & Back',
    linesZh: ['手机：点右下【发射酱汁】','电脑：按 E / 空格 / 回车','左上角 ← 可返回标题','点击卡片任意处翻页'],
    linesEn: ['Mobile: tap [Launch Sauce] bottom-right','Desktop: press E / Space / Enter','Top-left ← returns to title','Tap anywhere on the card to flip'] }
];

/* ===== 制作名单：臭鸡条为主制作，其他人+AI 全部鸣谢 ===== */
const STAFF = {
  rows: [
    { labelZh:'主 制 作', labelEn:'Lead Creator', valueZh:'臭鸡条', valueEn:'Chou Ji Tiao', ds:false },
    { labelZh:'鸣  谢', labelEn:'Special Thanks', valueZh:'臭鸡柳 · 臭鸡块', valueEn:'Chou Ji Liu · Chou Ji Kuai', ds:false },
    { labelZh:'鸣  谢', labelEn:'Special Thanks', valueZh:'DeepSeek · 千问', valueEn:'DeepSeek · Qianwen', ds:true }
  ]
};
function staffRowLabelY(i) { return 345 + i * 95; }
function staffRowValueY(i) { return 381 + i * 95; }

const START_BTN = { x: W/2, y: 416, w: 240, h: 62 };
const RULES_BTN = { x: W/2, y: 490, w: 200, h: 48 };
const STAFF_BTN = { x: W/2, y: 550, w: 200, h: 48 };
const LINK_BTN = { x: W/2, y: 608, w: 220, h: 48 };

const DIFF_CARDS = [
  { key:'easy',   cy: 260, w: 340, h: 90 },
  { key:'normal', cy: 368, w: 340, h: 90 },
  { key:'hard',   cy: 476, w: 340, h: 90 }
];

let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  // iOS Safari 初始为 suspended，不 resume 就没声音
  try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function beep(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol || 0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function sweep(f1, f2, dur, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f1, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function easeOutBack(t) { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeInBack(t) { const c1=1.70158, c3=c1+1; return c3*t*t*t - c1*t*t; }

let state = 'title';
let score = 0;
let best = 0;
try { best = +(localStorage.getItem('jwdb_best') || 0); } catch(e) {}
let totalScore = 0;
try { totalScore = +(localStorage.getItem('jwdb_total') || 0); } catch(e) {}
let hp = 6;
let MAX_HP = 6;

let player = { x: W/2, y: H-130, targetX: W/2 };
let bullets = [], enemies = [], particles = [], stars = [], shockwaves = [];
let sauceMeter = 0;
let shootTimer = 0, spawnTimer = 0, gameTime = 0;
let shake = 0, flash = 0, lineFlash = 0, invuln = 0;
let dragging = false, lastPointerX = 0;
let hoverBtn = null;
let gameoverAt = 0, victoryAt = 0;
let rulesPage = 0, rulesT = 1, rulesEnter = 1;
let staffEnter = 1, staffT = 1, diffEnter = 1;
let edgeSwipe = { tracking:false, startX:0, startY:0, edge:0 };
let easterEgg = { active:false, t:0, side:0 };
const EGG_DUR = 240;
let dsClicks = 0, dsLastClick = 0;

const STRIKE = { x: W/2, y: H-48, w: 280, h: 20 };
const LAUNCH = { x: 280, y: H-60, w: 180, h: 36 };
// 暂停菜单 / 结算页按钮
const PAUSE_RESUME  = { x: W/2, y: 330, w: 240, h: 52 };
const PAUSE_RESTART = { x: W/2, y: 404, w: 240, h: 52 };
const PAUSE_QUIT    = { x: W/2, y: 478, w: 240, h: 52 };
const GO_REPLAY = { x: W/2, y: 620, w: 220, h: 52 };
const GO_HOME   = { x: W/2, y: 684, w: 170, h: 40 };

const input = { left:false, right:false, targetX: W/2 };

function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H };
}
function strikeReady() { return sauceMeter >= 100; }
// 触发区收窄到能量条本体，且只有能量满时才捕获点击（否则允许正常拖动）
function strikeBarRect() {
  const bw = useTouchControls ? 250 : 300, bh = useTouchControls ? 20 : 22;
  const bx = 24, by = H - (useTouchControls ? 52 : 58);
  return { x:bx, y:by, w:bw, h:bh };
}
function inStrikeZone(p) {
  const r = strikeBarRect();
  return p.x >= r.x-6 && p.x <= r.x+r.w+6 && p.y >= r.y-4 && p.y <= r.y+r.h+6;
}
function inLaunchButton(p) {
  if (!useTouchControls) return false;
  return p.x >= LAUNCH.x && p.x <= LAUNCH.x + LAUNCH.w && p.y >= LAUNCH.y && p.y <= LAUNCH.y + LAUNCH.h;
}
function inBackBtn(p) {
  const dx=p.x-BACK_BTN.x, dy=p.y-BACK_BTN.y, r=BACK_BTN.r+8;
  return dx*dx+dy*dy < r*r;
}
function inBtn(btn, p) {
  return Math.abs(p.x-btn.x) <= btn.w/2 && Math.abs(p.y-btn.y) <= btn.h/2;
}
function diffCardAt(p) {
  for (const c of DIFF_CARDS) {
    if (Math.abs(p.x-W/2) <= c.w/2 && Math.abs(p.y-c.cy) <= c.h/2) return c.key;
  }
  return null;
}
function rulesDotAt(p) {
  const dotsY=596, dotGap=20, startX=W/2-(RULES.length-1)*dotGap/2;
  for (let i=0;i<RULES.length;i++) {
    const dx=startX+i*dotGap;
    if (Math.abs(p.x-dx)<13 && Math.abs(p.y-dotsY)<20) return i;
  }
  return -1;
}
function staffDSHit(p) {
  if (state!=='staff') return false;
  for (let i=0;i<STAFF.rows.length;i++) {
    if (!STAFF.rows[i].ds) continue;
    const y=staffRowValueY(i);
    if (Math.abs(p.x-W/2)<=90 && Math.abs(p.y-y)<=16) return true;
  }
  return false;
}
function noticeMouse() { if (useTouchControls) useTouchControls = false; }
function noticeTouch() { if (!useTouchControls) useTouchControls = true; }

function handleDSClick() {
  const now = performance.now();
  if (now-dsLastClick>1500) dsClicks=0;
  dsClicks++; dsLastClick=now;
  beep(560+dsClicks*260, 0.05, 'triangle', 0.045);
  if (dsClicks>=3) {
    dsClicks=0; flash=0.6;
    beep(1200, 0.12, 'triangle', 0.05);
    setTimeout(()=>window.open('https://www.deepseek.com','_blank'), 140);
  }
}

function checkEdgeStart(p) {
  if (p.x<24) { edgeSwipe={tracking:true,startX:p.x,startY:p.y,edge:-1}; return true; }
  if (p.x>W-24) { edgeSwipe={tracking:true,startX:p.x,startY:p.y,edge:1}; return true; }
  edgeSwipe.tracking=false; return false;
}
function triggerEasterEgg(side) {
  if (easterEgg.active) return;
  easterEgg={active:true,t:0,side:side};
  beep(880,0.09,'triangle',0.05);
  setTimeout(()=>beep(1180,0.11,'triangle',0.05),90);
  setTimeout(()=>beep(1480,0.14,'triangle',0.05),190);
}

function onPointerDown(e) {
  e.preventDefault(); initAudio();
  if (needRotateHint()) return;
  if (e.pointerType==='touch') noticeTouch();
  else if (e.pointerType==='mouse') noticeMouse();
  const p = toCanvas(e);

  if (state==='title') {
    if (inBtn(START_BTN,p)) { state='difficulty'; diffEnter=0; beep(620,0.08,'square',0.04); return; }
    if (inBtn(RULES_BTN,p)) { state='rules'; rulesPage=0; rulesT=1; rulesEnter=0; beep(520,0.06,'square',0.03); return; }
    if (inBtn(STAFF_BTN,p)) { state='staff'; staffT=1; staffEnter=0; beep(640,0.06,'square',0.03); return; }
    if (inBtn(LINK_BTN,p)) { beep(550,0.06,'square',0.03); showLinkModal(); return; }
    checkEdgeStart(p); return;
  }
  if (state==='difficulty') {
    if (inBackBtn(p)) { toTitle(); beep(360,0.06,'square',0.03); return; }
    const key=diffCardAt(p); if (key) { startGame(key); return; }
    checkEdgeStart(p); return;
  }
  if (state==='paused') {
    if (inBtn(PAUSE_RESUME,p)) { state='playing'; hoverBtn=null; beep(620,0.07,'square',0.035); return; }
    if (inBtn(PAUSE_RESTART,p)) { startGame(difficulty); hoverBtn=null; beep(520,0.07,'square',0.035); return; }
    if (inBtn(PAUSE_QUIT,p)) { bankRun(); toTitle(); hoverBtn=null; beep(360,0.08,'square',0.04); return; }
    return;
  }
  if (state==='rules') {
    if (inBackBtn(p)) { toTitle(); beep(360,0.06,'square',0.03); return; }
    const dot=rulesDotAt(p);
    if (dot>=0) { if (dot!==rulesPage) { rulesPage=dot; rulesT=0; beep(620,0.05,'square',0.025); } return; }
    if (p.y>100 && p.y<555) { rulesPage=(rulesPage+1)%RULES.length; rulesT=0; beep(620,0.05,'square',0.025); }
    checkEdgeStart(p); return;
  }
  if (state==='staff') {
    if (inBackBtn(p)) { toTitle(); beep(360,0.06,'square',0.03); return; }
    if (staffDSHit(p)) { handleDSClick(); return; }
    checkEdgeStart(p); return;
  }
  if (state==='gameover') {
    if (performance.now()-gameoverAt<500) return;
    if (inBtn(GO_REPLAY,p)) { beep(620,0.07,'square',0.035); startGame(difficulty); return; }
    if (inBtn(GO_HOME,p)) { beep(360,0.06,'square',0.03); toTitle(); hoverBtn=null; return; }
    return;
  }
  if (state==='victory') {
    if (performance.now()-victoryAt<500) return;
    if (inBtn(GO_REPLAY,p)) { beep(620,0.07,'square',0.035); startGame(difficulty); return; }
    if (inBtn(GO_HOME,p)) { beep(360,0.06,'square',0.03); toTitle(); hoverBtn=null; return; }
    return;
  }

  if (inBackBtn(p)) { pauseGame(); return; }
  if (inStrikeZone(p) && strikeReady()) { tryStrike(); return; }
  if (inLaunchButton(p)) { tryStrike(); return; }
  if (checkEdgeStart(p)) return;
  if (e.pointerType==='touch') { dragging=true; lastPointerX=p.x; }
  else { input.targetX=p.x; dragging=true; }
}

function onPointerMove(e) {
  if (needRotateHint()) return;
  if (e.pointerType==='touch') noticeTouch();
  else if (e.pointerType==='mouse') noticeMouse();
  const p = toCanvas(e);
  if (edgeSwipe.tracking && !easterEgg.active) {
    const dx=p.x-edgeSwipe.startX, dy=Math.abs(p.y-edgeSwipe.startY);
    const dist=edgeSwipe.edge===-1?dx:-dx;
    if (dist>90 && dy<140) { triggerEasterEgg(edgeSwipe.edge); edgeSwipe.tracking=false; return; }
  }
  if (state==='title') {
    if (inBtn(START_BTN,p)) hoverBtn='start';
    else if (inBtn(RULES_BTN,p)) hoverBtn='rules';
    else if (inBtn(STAFF_BTN,p)) hoverBtn='staff';
    else if (inBtn(LINK_BTN,p)) hoverBtn='link';
    else hoverBtn=null; return;
  }
  if (state==='difficulty') { hoverBtn=diffCardAt(p); return; }
  if (state!=='playing') return;
  if (e.pointerType==='mouse') input.targetX=p.x;
  else if (dragging && useTouchControls) input.targetX=p.x;
}
function endDrag() { dragging=false; edgeSwipe.tracking=false; }

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', ()=>{ endDrag(); if (state==='playing') pauseGame(); });
canvas.addEventListener('touchstart', e => { if (e.touches.length) noticeTouch(); e.preventDefault(); }, {passive:false});

window.addEventListener('keydown', e => {
  initAudio(); noticeMouse();
  if (state==='title') {
    if (e.code==='Enter'||e.code==='Space') { state='difficulty'; diffEnter=0; e.preventDefault(); return; }
    if (e.code==='Digit1') { startGame('easy'); e.preventDefault(); return; }
    if (e.code==='Digit2') { startGame('normal'); e.preventDefault(); return; }
    if (e.code==='Digit3') { startGame('hard'); e.preventDefault(); return; }
    if (e.code==='KeyR'||e.code==='Slash') { state='rules'; rulesPage=0; rulesT=1; rulesEnter=0; e.preventDefault(); return; }
    if (e.code==='KeyC') { state='staff'; staffT=1; staffEnter=0; e.preventDefault(); return; }
  }
  if (state==='difficulty') {
    if (e.code==='Escape') { toTitle(); e.preventDefault(); return; }
    if (e.code==='Digit1') { startGame('easy'); e.preventDefault(); return; }
    if (e.code==='Digit2') { startGame('normal'); e.preventDefault(); return; }
    if (e.code==='Digit3') { startGame('hard'); e.preventDefault(); return; }
  }
  if (state==='rules') {
    if (e.code==='Escape'||e.code==='KeyR') { toTitle(); e.preventDefault(); return; }
    if (e.code==='ArrowRight'||e.code==='Space'||e.code==='Enter') { rulesPage=(rulesPage+1)%RULES.length; rulesT=0; e.preventDefault(); return; }
    if (e.code==='ArrowLeft') { rulesPage=(rulesPage-1+RULES.length)%RULES.length; rulesT=0; e.preventDefault(); return; }
  }
  if (state==='staff') { if (e.code==='Escape'||e.code==='KeyC') { toTitle(); e.preventDefault(); return; } }
  if (state==='paused') {
    if (e.code==='Escape'||e.code==='KeyP'||e.code==='Space'||e.code==='Enter') { state='playing'; e.preventDefault(); return; }
    if (e.code==='KeyR') { startGame(difficulty); e.preventDefault(); return; }
    if (e.code==='KeyQ') { bankRun(); toTitle(); hoverBtn=null; e.preventDefault(); return; }
  }
  if (state==='gameover'||state==='victory') {
    if (e.code==='Space'||e.code==='Enter') { startGame(difficulty); e.preventDefault(); return; }
    if (e.code==='Escape') { toTitle(); hoverBtn=null; e.preventDefault(); return; }
  }
  if (e.code==='ArrowLeft'||e.code==='KeyA') { input.left=true; e.preventDefault(); }
  if (e.code==='ArrowRight'||e.code==='KeyD') { input.right=true; e.preventDefault(); }
  if (e.code==='Space'||e.code==='KeyE'||e.code==='Enter') { e.preventDefault(); if (state==='playing') tryStrike(); }
  if (e.code==='Escape' && state==='playing') { pauseGame(); e.preventDefault(); return; }
  if (e.code==='KeyP' && state==='playing') { pauseGame(); e.preventDefault(); return; }
});
window.addEventListener('keyup', e => {
  if (e.code==='ArrowLeft'||e.code==='KeyA') input.left=false;
  if (e.code==='ArrowRight'||e.code==='KeyD') input.right=false;
});

for (let i=0;i<90;i++) stars.push({ x:Math.random()*W, y:Math.random()*H, r:rand(0.4,1.8), s:rand(0.1,0.6), a:rand(0.2,0.9) });

function burst(x,y,color,n) {
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, sp=rand(1,6);
    particles.push({ x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:rand(2,5.5), life:rand(24,50), g:0.14, color });
  }
  if (particles.length>350) particles.splice(0,20);
}

function startGame(diffKey) {
  difficulty=diffKey||'easy'; D=DIFFS[difficulty]; state='playing';
  score=0; MAX_HP=D.hp; hp=D.hp; sauceMeter=0;
  bullets=[]; enemies=[]; particles=[]; shockwaves=[];
  shootTimer=0; spawnTimer=D.spawnStart*0.85; gameTime=0;
  shake=0; flash=0; lineFlash=0; invuln=0;
  player.x=player.targetX=W/2; input.targetX=W/2;
  input.left=input.right=false; dragging=false;
  runBanked=false; hoverBtn=null;
}
function hurt(dmg) {
  if (state!=='playing') return; if (invuln>0) return;
  dmg = dmg || 1;
  hp -= dmg; invuln=D.invuln; shake=18; flash=0.6;
  sweep(220,60,0.3,0.09);
  if (hp<=0) { hp=0; gameOver(); }
}
// 中途退出也结算总分（否则兑换系统会漏分）；runBanked 防止重复结算
let runBanked = false;
function bankRun() {
  if (runBanked) return;
  runBanked = true;
  if (score>best) { best=score; try{localStorage.setItem('jwdb_best',String(best));}catch(e){} }
  totalScore += score;
  try { localStorage.setItem('jwdb_total', String(totalScore)); } catch(e) {}
}
function pauseGame() {
  if (state!=='playing') return;
  state='paused'; dragging=false; input.left=false; input.right=false;
  beep(420,0.06,'square',0.03);
}
function gameOver() {
  state='gameover'; gameoverAt=performance.now();
  burst(player.x,player.y,'#ffd93d',46); burst(player.x,player.y,'#ff3b3b',26);
  shake=32; sweep(160,40,0.7,0.12);
  bankRun();
}
function winGame() {
  state='victory'; victoryAt=performance.now(); flash=0.9; shake=14;
  const colors=['#ffd93d','#ff6b1a','#7ee787','#79c0ff','#ff2d55','#d2a8ff'];
  for (let i=0;i<6;i++) { const c=colors[i]; setTimeout(()=>{ if(state==='victory') burst(rand(80,W-80),rand(100,340),c,20); }, i*110); }
  sweep(320,1100,0.7,0.12); beep(660,0.15,'square',0.05);
  setTimeout(()=>beep(880,0.2,'square',0.05),130);
  bankRun();
}
function tryStrike() {
  if (state!=='playing') return;
  if (sauceMeter<100) { beep(180,0.08,'square',0.03); return; }
  sauceMeter=0; shake=28; flash=1.4; sweep(900,70,0.6,0.14);
  shockwaves.push({ x:player.x, y:player.y, r:10, life:1 });
  shockwaves.push({ x:player.x, y:player.y, r:-60, life:1 });
  for (const e of enemies) { if (!e.flattening) { e.flattening=true; e.squash=Math.min(e.squash,1); } }
}
function spawnEnemy() {
  const prog=Math.min(1, gameTime/4200);
  const r=Math.random(); let type;
  if (r<0.08+prog*0.14) type='tank';
  else if (r<0.40) type='zig';
  else type='grunt';
  const e={ x:rand(50,W-50), y:-50, squash:1, flattening:false, hitFlash:0, t:Math.random()*100, type };
  if (type==='grunt') Object.assign(e,{ r:20, hp:1, vy:(1.15+prog*0.85)*D.speedMul, points:10, color:'#7ee787' });
  else if (type==='zig') Object.assign(e,{ r:16, hp:D.zigHp, vy:(1.0+prog*0.6)*D.speedMul, points:15, color:'#79c0ff' });
  else Object.assign(e,{ r:32, hp:D.tankHp, vy:(0.65+prog*0.45)*D.speedMul, points:30, color:'#d2a8ff' });
  enemies.push(e);
}

function update(dt) {
  for (const s of stars) { s.y+=s.s*dt; if (s.y>H+5) { s.y=-5; s.x=Math.random()*W; } }
  if (needRotateHint()) return;
  gameTime+=dt;
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.vx*=Math.pow(0.97,dt); p.life-=dt;
    if (p.life<=0) particles.splice(i,1);
  }
  for (let i=shockwaves.length-1;i>=0;i--) { const s=shockwaves[i]; s.r+=18*dt; s.life-=0.022*dt; if (s.life<=0) shockwaves.splice(i,1); }
  if (shake>0) shake=Math.max(0,shake-0.9*dt);
  if (flash>0) flash=Math.max(0,flash-0.05*dt);
  if (lineFlash>0) lineFlash=Math.max(0,lineFlash-0.04*dt);
  if (state==='rules') { if (rulesT<1) rulesT=Math.min(1,rulesT+0.09*dt); if (rulesEnter<1) rulesEnter=Math.min(1,rulesEnter+0.1*dt); }
  if (state==='staff') { if (staffT<1) staffT=Math.min(1,staffT+0.09*dt); if (staffEnter<1) staffEnter=Math.min(1,staffEnter+0.1*dt); }
  if (state==='difficulty') { if (diffEnter<1) diffEnter=Math.min(1,diffEnter+0.12*dt); }
  if (easterEgg.active) { easterEgg.t+=dt; if (easterEgg.t>EGG_DUR) { easterEgg.active=false; easterEgg.t=0; } }
  if (state!=='playing') return;
  if (invuln>0) invuln-=dt;
  if (input.left) input.targetX-=13*dt;
  if (input.right) input.targetX+=13*dt;
  input.targetX=clamp(input.targetX,46,W-46);
  player.targetX=input.targetX;
  player.x+=(player.targetX-player.x)*Math.min(1,0.3*dt);
  shootTimer-=dt;
  if (shootTimer<=0) {
    shootTimer=D.shootInterval;
    bullets.push({ x:player.x-15, y:player.y-18, vy:-14, r:7, wob:Math.random()*6.28 });
    bullets.push({ x:player.x+15, y:player.y-18, vy:-14, r:7, wob:Math.random()*6.28 });
  }
  for (let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i]; b.y+=b.vy*dt; b.wob+=0.25*dt; b.x+=Math.sin(b.wob)*1.1*dt;
    if (b.y<-30) bullets.splice(i,1);
  }
  spawnTimer-=dt;
  if (spawnTimer<=0) { spawnEnemy(); spawnTimer=Math.max(D.spawnMin, D.spawnStart-gameTime*D.spawnRamp); }
  for (let i=enemies.length-1;i>=0;i--) {
    const e=enemies[i]; e.t+=dt; if (e.hitFlash>0) e.hitFlash-=dt;
    if (e.flattening) {
      e.squash=Math.max(0,e.squash-0.05*dt);
      if (e.squash<=0.03) { burst(e.x,e.y,e.color,20); score+=e.points; sauceMeter=Math.min(100,sauceMeter+D.cFlatten); enemies.splice(i,1); continue; }
    } else {
      e.y+=e.vy*dt;
      if (e.type==='zig') e.x+=Math.sin(e.t*0.06)*2.4*dt;
      e.x=clamp(e.x,e.r,W-e.r);
    }
    if (!e.flattening && e.y>LINE_Y) {
      burst(e.x,LINE_Y,'#ff3b3b',22); burst(e.x,LINE_Y,'#ffd93d',8);
      lineFlash=1; enemies.splice(i,1); hurt(e.type==='tank'?2:1); continue;
    }
  }
  for (let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    for (let j=enemies.length-1;j>=0;j--) {
      const e=enemies[j]; if (e.flattening) continue;
      const dx=b.x-e.x, dy=b.y-e.y, rr=e.r+b.r;
      if (dx*dx+dy*dy<rr*rr) {
        e.hp-=1; e.hitFlash=6; burst(b.x,b.y,'#ffb347',4);
        sauceMeter=Math.min(100,sauceMeter+D.cBullet); bullets.splice(i,1);
        if (e.hp<=0) {
          burst(e.x,e.y,e.color,16); score+=e.points;
          sauceMeter=Math.min(100,sauceMeter+D.cKill); enemies.splice(j,1);
          beep(300+Math.random()*240,0.07,'square',0.028);
        }
        break;
      }
    }
  }
  if (state==='playing' && score>=D.winScore) winGame();
}

function rrect(x,y,w,h,r) {
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawStars(alpha) {
  for (const s of stars) { ctx.globalAlpha=s.a*(alpha||1); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawBg() {
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#150826'); bg.addColorStop(0.55,'#241040'); bg.addColorStop(1,'#3a1a4a');
  ctx.fillStyle=bg; ctx.fillRect(-40,-40,W+80,H+80);
}
function drawEnemyShape(type,x,y,r,color,alpha) {
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.translate(x,y);
  ctx.shadowColor=color; ctx.shadowBlur=12; ctx.fillStyle=color;
  ctx.beginPath();
  if (type==='tank') rrect(-r,-r,r*2,r*2,9);
  else if (type==='zig') { ctx.moveTo(0,-r); ctx.lineTo(r,0); ctx.lineTo(0,r); ctx.lineTo(-r,0); ctx.closePath(); }
  else ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.arc(0,r*0.25,r*0.62,0,Math.PI*2); ctx.fill();
  const eyeR=Math.max(2.2,r*0.16), eyeY=-r*0.12, eyeX=r*0.32;
  ctx.fillStyle='#16162a';
  ctx.beginPath(); ctx.arc(-eyeX,eyeY,eyeR*1.5,0,Math.PI*2); ctx.arc(eyeX,eyeY,eyeR*1.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-eyeX+eyeR*0.5,eyeY-eyeR*0.5,eyeR*0.55,0,Math.PI*2); ctx.arc(eyeX+eyeR*0.5,eyeY-eyeR*0.5,eyeR*0.55,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawBackBtn() {
  ctx.save(); ctx.translate(BACK_BTN.x, BACK_BTN.y);
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(0,0,BACK_BTN.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,BACK_BTN.r-1,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(4,-8); ctx.lineTo(-5,0); ctx.lineTo(4,8); ctx.stroke();
  ctx.restore();
}
function drawDefenseLine(now) {
  const pulse=0.5+Math.sin(now/350)*0.5, lf=lineFlash;
  const g=ctx.createLinearGradient(0,LINE_Y-26,0,LINE_Y+26);
  g.addColorStop(0,'rgba(255,45,85,0)');
  g.addColorStop(0.5,'rgba(255,45,85,'+(0.10+pulse*0.07+lf*0.35)+')');
  g.addColorStop(1,'rgba(255,45,85,0)');
  ctx.fillStyle=g; ctx.fillRect(0,LINE_Y-26,W,52);
  ctx.save();
  ctx.strokeStyle='rgba(255,75,115,'+(0.8+pulse*0.2+lf*0.2)+')';
  ctx.lineWidth=3+lf*3; ctx.shadowColor='#ff2d55'; ctx.shadowBlur=14+pulse*10+lf*24;
  ctx.setLineDash([15,10]); ctx.lineDashOffset=-now/45;
  ctx.beginPath(); ctx.moveTo(0,LINE_Y); ctx.lineTo(W,LINE_Y); ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(255,217,61,'+(0.35+pulse*0.35)+')';
  ctx.lineWidth=2; ctx.shadowColor='#ffd93d'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(W/2-44,LINE_Y); ctx.lineTo(W/2+44,LINE_Y); ctx.stroke();
  ctx.restore();
}
function drawHealthBar(now) {
  const bw=150, bh=18, bx=W-bw-20, by=32;
  ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.font='bold 12px "PingFang SC",sans-serif';
  ctx.fillText(L('血量','HP'),W-20,by-8);
  ctx.fillStyle='rgba(0,0,0,0.5)'; rrect(bx-3,by-3,bw+6,bh+6,(bh+6)/2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.10)'; rrect(bx,by,bw,bh,bh/2); ctx.fill();
  const ratio=hp/MAX_HP;
  if (ratio>0) {
    let c1,c2;
    if (ratio>0.66) { c1='#7ee787'; c2='#2ecc71'; }
    else if (ratio>0.33) { c1='#ffd93d'; c2='#ff9f43'; }
    else { c1='#ff6b6b'; c2='#ff2d55'; }
    const fw=bw*ratio;
    const gg=ctx.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,c1); gg.addColorStop(1,c2);
    ctx.save(); ctx.shadowColor=c2; ctx.shadowBlur=10; ctx.fillStyle=gg;
    rrect(bx,by,fw,bh,bh/2); ctx.fill(); ctx.restore();
  }
  for (let i=1;i<MAX_HP;i++) {
    const sx=bx+bw*(i/MAX_HP);
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx,by+3); ctx.lineTo(sx,by+bh-3); ctx.stroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 12px "PingFang SC",sans-serif'; ctx.lineJoin='round'; ctx.lineWidth=3;
  ctx.strokeStyle='rgba(0,0,0,0.75)'; ctx.strokeText(hp+' / '+MAX_HP,bx+bw/2,by+bh/2+0.5);
  ctx.fillStyle='#fff'; ctx.fillText(hp+' / '+MAX_HP,bx+bw/2,by+bh/2+0.5);
  ctx.textBaseline='alphabetic';
  if (ratio<=0.34 && hp>0) {
    const p=0.5+Math.sin(now/160)*0.5;
    ctx.save();
    ctx.strokeStyle='rgba(255,60,90,'+(0.4+p*0.6)+')'; ctx.lineWidth=2.5;
    ctx.shadowColor='#ff2d55'; ctx.shadowBlur=14+p*14;
    rrect(bx-3,by-3,bw+6,bh+6,(bh+6)/2); ctx.stroke(); ctx.restore();
  }
}

  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0,40,30,8,0,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.moveTo(-14,38); ctx.lineTo(-21,43); ctx.moveTo(-14,38); ctx.lineTo(-8,44);
  ctx.moveTo(14,38); ctx.lineTo(21,43); ctx.moveTo(14,38); ctx.lineTo(8,44); ctx.stroke();
  ctx.fillStyle='#ffd93d'; ctx.beginPath(); ctx.ellipse(0,0,30,30,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(-9,-12,11,8,-0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f5c518';
  ctx.beginPath(); ctx.ellipse(-27,7,9,16,0.35,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(27,7,9,16,-0.35,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e63946';
  ctx.beginPath(); ctx.arc(-11,-27,8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-34,9.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(11,-27,8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(-10,-6,4.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(10,-6,4.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-8.4,-7.6,1.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(11.6,-7.6,1.8,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f4a620';
  ctx.beginPath(); ctx.moveTo(-7,6); ctx.lineTo(7,6); ctx.lineTo(0,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.moveTo(-7,6); ctx.lineTo(7,6); ctx.lineTo(0,10); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawLaunchButton(now) {
  if (!useTouchControls) return;
  const ready=strikeReady(), pulse=0.5+Math.sin(now/180)*0.5;
  const bx=LAUNCH.x, by=LAUNCH.y, bw=LAUNCH.w, bh=LAUNCH.h;
  const r=bh/3;
  if (ready) {
    ctx.save(); ctx.globalAlpha=0.35+pulse*0.4; ctx.fillStyle='#ffd93d';
    ctx.shadowColor='#ffd93d'; ctx.shadowBlur=30;

/* ===== 一次性互通码：生成时就从可兑换分数里扣下，米皮糖按编号去重 ===== */
function jwOutCode() {
  var box = document.getElementById('xcBox');
  var msg = document.getElementById('xcMsg');
  var total = Number(localStorage.getItem('jwdb_total') || '0');
  var redeemed = Number(localStorage.getItem('jwdb_redeemed') || '0');
  var avail = total - redeemed;
  if (avail < 1000) {
    if (msg) msg.textContent = L('暂无可导出的分数（至少 1000 分）', 'Nothing to export (needs 1000 pts)');
    return;
  }
  var payload = {
    v: 2,
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    from: 'jw',
    jwBal: avail
  };
  var code = 'X2|' + JSON.stringify(payload);
  redeemed += avail;
  try { localStorage.setItem('jwdb_redeemed', String(redeemed)); } catch (e) {}
  if (box) {
    box.value = code;
    try { box.focus(); box.setSelectionRange(0, code.length); } catch (e) {}
  }
  var ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code); ok = true; } } catch (e) {}
  if (msg) msg.textContent = (ok ? L('已复制', 'Copied') : L('已生成，长按复制', 'Generated — long-press to copy'))
    + L('（导出 ' + avail + ' 分，只能导入一次）', ' (' + avail + ' pts, single use)');
  showLinkModal();
  var m2 = document.getElementById('xcMsg');
  if (m2) m2.textContent = msg ? msg.textContent : '';
}

function showLinkModal() {
  var modal = document.getElementById('linkModal');

}

var XSYNC_MAP = {
  eggTot: ['eggduck_total_score', 'mitang_eggduck_total_score'],
  eggRed: ['eggduck_redeemed', 'mitang_eggduck_redeemed'],
  jwTot: ['jwdb_total'],
  jwRed: ['jwdb_redeemed'],
  oxyTot: ['oxy_total_saved'],
  oxyBal: ['oxy_saved_balance'],
  oxyGold: ['oxy_gold_exchanged', 'oxy_gold_for_mpt'],
  jwGold: ['mpt_jiangwei_gold'],
  coins: ['totalCoins']
};
var XSYNC_MEM = {};
function xsRead(k) {
  try { return parseInt(localStorage.getItem(k) || '0', 10) || 0; } catch (e) { return XSYNC_MEM[k] || 0; }
}
function xsWrite(k, v) {
  XSYNC_MEM[k] = v;
  try { localStorage.setItem(k, String(v)); } catch (e) {}
}
function xsExport() {
  var d = {}, k, ks, i, v, mx;
  for (k in XSYNC_MAP) {
    ks = XSYNC_MAP[k]; mx = 0;
    for (i = 0; i < ks.length; i++) { v = xsRead(ks[i]); if (v > mx) mx = v; }
    if (mx) d[k] = mx;
  }
  return 'X1|' + JSON.stringify(d);
}

/* ===== 同源自动监听：同源存档发生变化时刷新弹窗 ===== */

var XSYNC_LAST = null;
function xsAutoWatch(onChange) {
  function tick() {
    var cur = xsExport();
    if (XSYNC_LAST === null) { XSYNC_LAST = cur; return; }
    if (cur !== XSYNC_LAST) { XSYNC_LAST = cur; try { onChange(); } catch (e) {} }
  }
  XSYNC_LAST = xsExport();
  try { window.addEventListener('storage', tick); } catch (e) {}
  setInterval(tick, 2500);
}
if (window.addEventListener) {
  window.addEventListener('load', function () {
    xsAutoWatch(function () {
      var m = document.getElementById('linkModal');
      if (m && m.classList.contains('show')) showLinkModal();
    });
  });
}
